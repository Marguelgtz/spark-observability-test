name: Sync dashboard lockfile

on:
  push:
    branches:
      - dashboard/phase-1
    paths:
      - 'apps/web/package.json'
      - 'packages/dashboard-contracts/package.json'
      - '.github/workflows/sync-dashboard-lockfile.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dashboard/phase-1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'sync dashboard lockfile'
          git push origin HEAD:dashboard/phase-1
