name = "spark-api"
main = "src/index.ts"
compatibility_date = "2026-08-26"

[secrets]
required = [
  "GITHUB_APP_ID",
  "GITHUB_PRIVATE_KEY",
  "GITHUB_WEBHOOK_SECRET",
  "GITHUB_CLIENT_ID",
  "GITHUB_CLIENT_SECRET",
  "GITHUB_APP_SLUG",
  "SPARK_CONTACT_EMAIL"
]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/",
  "/api/*",
  "/auth/*",
  "/webhooks/*",
  "/health",
  "/privacy",
  "/terms"
]

[[d1_databases]]
binding = "DB"
database_name = "spark"
database_id = "2db2d9a2-41e7-405c-81a5-7912a9c80773"
migrations_dir = "migrations"
